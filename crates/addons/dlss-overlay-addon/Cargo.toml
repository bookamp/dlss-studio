[package]
name = "dlss-overlay-addon"
version = "1.0.0"
edition = "2021"
description = "DLSS Studio ReShade Companion Overlay Add-on and Host Bridge"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
name = "dlss_overlay_addon"

[[test]]
name = "addon"
path = "tests/bridge.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
] }
