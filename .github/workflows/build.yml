name: Build & Release DLSS Studio

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty for v<version> from Cargo.toml)'
        required: false
        default: ''
      release_title:
        description: 'Release title (leave empty for automatic commit title)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Publish as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release (Setup & Portable)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Test Suite
        run: cargo test --workspace --verbose

      - name: Build Release Binaries (Setup & Portable)
        shell: powershell
        run: |
          $cargoToml = Get-Content -Path "Cargo.toml" -Raw
          if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
              $version = $matches[1]
          } else {
              $version = "1.0.0"
          }
          Write-Host "Building release binaries for v$version..."
          cargo build --release --bin dlss-studio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --bin dlss-studio-setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release -p dlss-mip-addon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Path "target\release\dlss-studio.exe" -Destination "target\release\dlss-studio-v$version-portable.exe" -Force
          Copy-Item -Path "target\release\dlss-studio-setup.exe" -Destination "target\release\dlss-studio-v$version-setup.exe" -Force
          Copy-Item -Path "target\release\dlss_mip_addon.dll" -Destination "target\release\dlss-mip-fix.addon64" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dlss-studio-windows-x64
          path: |
            target/release/dlss-studio-v*-portable.exe
            target/release/dlss-studio-v*-setup.exe
            target/release/dlss-mip-fix.addon64
          if-no-files-found: error

      - name: Prepare Release Notes & Commit Comments
        id: release_meta
        shell: bash
        run: |
          # 1. Determine release tag
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/' | tr -d ' "')
          INPUT_TAG="${{ inputs.tag_name }}"
          
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${CARGO_VER}"
          fi

          # 2. Extract commit details and comments
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          AUTHOR_NAME=$(git log -1 --pretty=%an)
          COMMIT_DATE=$(git log -1 --pretty=%ad --date=format:'%Y-%m-%d %H:%M:%S UTC')

          INPUT_TITLE="${{ inputs.release_title }}"
          if [ -n "$INPUT_TITLE" ]; then
            TITLE="$INPUT_TITLE"
          elif [ -f "RELEASE_NOTES.md" ]; then
            FIRST_HEADER=$(head -n 1 RELEASE_NOTES.md | sed 's/^# *//' | tr -d '\r')
            if [ -n "$FIRST_HEADER" ]; then
              TITLE="${FIRST_HEADER}"
            else
              TITLE="${TAG} — DLSS Studio"
            fi
          else
            TITLE="${TAG} — ${COMMIT_SUBJECT}"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

          # 3. Resolve release notes markdown
          if [ -f "RELEASE_NOTES.md" ]; then
            echo "body_file=RELEASE_NOTES.md" >> $GITHUB_OUTPUT
          else
            echo "body_file=generated_release_notes.md" >> $GITHUB_OUTPUT
            echo "## Release Overview" > generated_release_notes.md
            echo "" >> generated_release_notes.md
            echo "### Latest Commit Details" >> generated_release_notes.md
            echo "- **Commit:** \`${COMMIT_SHA}\`" >> generated_release_notes.md
            echo "- **Author:** ${AUTHOR_NAME}" >> generated_release_notes.md
            echo "- **Date:** ${COMMIT_DATE}" >> generated_release_notes.md
            echo "- **Summary:** **${COMMIT_SUBJECT}**" >> generated_release_notes.md

            HAS_BODY=$(git log -1 --pretty=%b)
            if [ -n "$HAS_BODY" ]; then
              echo "" >> generated_release_notes.md
              echo "#### Commit Comments & Description:" >> generated_release_notes.md
              git log -1 --pretty=%b >> generated_release_notes.md
            fi

            echo "" >> generated_release_notes.md
            echo "- **\`dlss-studio-v${CARGO_VER}-setup.exe\`**: Standalone Setup / Installer (Recommended) — Modern native Rust setup wizard with configurable install and data storage locations, Start Menu & Desktop shortcuts, Windows Add/Remove Programs registration" >> generated_release_notes.md
            echo "- **\`dlss-studio-v${CARGO_VER}-portable.exe\`**: Portable Executable — Standalone self-contained 64-bit Windows executable (includes embedded companion overlay add-on)" >> generated_release_notes.md
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          TITLE="${{ steps.release_meta.outputs.title }}"
          BODY_FILE="${{ steps.release_meta.outputs.body_file }}"

          # Delete any existing draft/failed release for this tag if present
          gh release delete "$TAG" --yes 2>/dev/null || true

          gh release create "$TAG" \
            target/release/dlss-studio-v*-setup.exe \
            target/release/dlss-studio-v*-portable.exe \
            target/release/dlss-mip-fix.addon64 \
            --title "$TITLE" \
            --notes-file "$BODY_FILE" \
            --latest
